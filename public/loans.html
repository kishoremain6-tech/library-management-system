<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Borrowing records</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="layout"><nav class="side"></nav><main>
<h1>Borrowing records</h1>
<section class="card issue-panel"><h2>Issue a book</h2><form id="issue" class="issue-form">
<label for="student">Student</label><select id="student" required><option value="">Select student</option></select>
<label for="book">Available book</label><select id="book" required><option value="">Select available book</option></select>
<button class="btn" type="submit">Issue book</button></form></section>
<section class="card records"><h2>Borrowed & returned history</h2><div class="bar">
<select id="status"><option value="">All records</option><option value="borrowed">Currently borrowed</option><option value="returned">Returned</option></select>
<label class="check"><input type="checkbox" id="overdue"> Overdue only</label>
<input id="memberSearch" placeholder="Search student or email">
</div><div class="wrap"><table><thead><tr><th>Student</th><th>Book</th><th>Borrowed</th><th>Due</th><th>Returned</th><th>Status</th><th>Fine</th><th>Action</th></tr></thead>
<tbody id="rows"></tbody></table></div></section>
</main></div>
<script src="js/app.js"></script><script>
const fmt=d=>d?new Date(d).toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}):'-';
let allRecords=[];
async function loadOptions(){
 const [users,catalogue]=await Promise.all([api('/api/auth/users'),api('/api/books?available=true')]);
 student.innerHTML='<option value="">Select student</option>'+users.filter(u=>u.role==='student').map(u=>`<option value="${u._id}">${esc(u.name)} — ${esc(u.email)}</option>`).join('');
 book.innerHTML='<option value="">Select available book</option>'+catalogue.books.map(b=>`<option value="${b._id}">${esc(b.title)} (${esc(b.category)}) — ${b.availableCopies} available</option>`).join('');
}
async function loadRecords(){
 const params=new URLSearchParams();if(status.value)params.set('status',status.value);if(overdue.checked)params.set('overdue','true');
 allRecords=await api('/api/loans'+(params.size?'?'+params:''));renderRecords();
}
function renderRecords(){
 const term=memberSearch.value.trim().toLower();const visible=allRecords.filter(l=>(esc(l.user?.name)+' '+esc(l.user?.email)).toLowerCase().includes(term));
 rows.innerHTML=visible.length?visible.map(l=>{const overdueLabel=l.overdue?' <span class="badge no">Overdue</span>':'';return `<tr>
 <td><b>${esc(l.user?.name||'-')}</b><br><small>${esc(l.user?.email||'-')}</small></td>
 <td>${esc(l.book?.title||'-')}<br><small>${esc(l.book?.isbn||'-')}</small></td>
 <td>${fmt(l.borrowedAt)}</td><td>${fmt(l.dueDate)}</td><td>${fmt(l.returnedAt)}</td>
 <td>${l.status==='borrowed'?'Borrowed':'Returned'}${overdueLabel}</td><td>₹${l.fine||0}</td>
 <td>${l.status==='borrowed'?`<button class="btn sm" onclick="returnBook('${l._id}')">Return</button>`:'-'}</td></tr>`;}).join(''):'<tr><td colspan="8" class="empty">No borrowing records found</td></tr>';
}
async function returnBook(id){if(!confirm('Mark this book as returned?'))return;try{await api('/api/loans/'+id+'/return','POST');toast('Book returned');await Promise.all([loadOptions(),loadRecords()]);}catch(e){toast(e.message,'err');}}
issue.onsubmit=async e=>{e.preventDefault();try{await api('/api/loans/issue','POST',{userId:student.value,bookId:book.value});toast('Book issued to student');issue.reset();await Promise.all([loadOptions(),loadRecords()]);}catch(e){toast(e.message,'err');}};
status.onchange=overdue.onchange=loadRecords;memberSearch.oninput=renderRecords;
(async()=>{const u=await requireUser();if(!u)return;if(u.role!=='admin'){location.href='/dashboard.html';return;}shell(u,'loans.html');await Promise.all([loadOptions(),loadRecords()]);})().catch(e=>toast(e.message,'err'));
</script></body></html>
