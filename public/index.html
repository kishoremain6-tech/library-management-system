<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="auth"><h1>📚 Library Login</h1><div class="card"><form id="f">
<label>Email</label><input type="email" id="email" required><label>Password</label><input type="password" id="pw" required>
<p><button class="btn" style="width:100%">Log in</button></p></form><p style="text-align:center">Library staff only</p></div></div>
<script src="js/app.js"></script><script>
api('/api/auth/me').then(()=>location.href='dashboard.html').catch(()=>{});
f.onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/login','POST',{email:email.value,password:pw.value});location.href='dashboard.html';}catch(x){toast(x.message,'err');}};
</script></body></html>
